[project]
name = "loopguard"
version = "0.1.0"
description = "A production runtime for AI agents: budgets, resilience, durable checkpoints, guardrails and tracing for tool-using Claude agents."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ajay Raghav" }]
requires-python = ">=3.10"
keywords = ["ai-agents", "llm", "claude", "anthropic", "guardrails", "observability", "prompt-injection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=2.0",
    "pydantic>=2.6",
    "rich>=13.0",
]

[project.scripts]
loopguard = "loopguard.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501", "RUF001", "RUF012"]
